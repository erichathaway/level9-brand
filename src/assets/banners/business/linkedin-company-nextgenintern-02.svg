<?xml version="1.0" encoding="UTF-8"?>
<!--
  The NextGen Intern company-page banner candidate 02.
  Future-of-work angle. Cyan + sky blue palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" role="img" aria-label="The NextGen Intern · The future of work needs the future of interns.">
  <defs>
    <linearGradient id="ngiText2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6"/>
