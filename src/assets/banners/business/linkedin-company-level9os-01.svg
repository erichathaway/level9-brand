<?xml version="1.0" encoding="UTF-8"?>
<!--
  Level9OS company-page banner candidate 01.
  Stack-claim angle. Full canonical violet -> cyan -> fuchsia palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" role="img" aria-label="Level9OS · AI for operations. Six products. One chassis.">
  <defs>
