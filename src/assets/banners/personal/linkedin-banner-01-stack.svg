<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 01 v2 · The Stack.
       Bigger text, bigger watermark, simpler chart. -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="hl1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="wm1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.16)"/>
      <stop offset="50%" stop-color="rgba(167,139,250,0.07)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </linearGradient>
    <radialGradient id="glow1" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg1)"/>
  <ellipse cx="1000" cy="198" rx="620" ry="280" fill="url(#glow1)"/>

  <!-- Left watermark: massive AI, gradient-faded so it dies into the center -->
  <text x="-10" y="340" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="380" fill="url(#wm1)" letter-spacing="-0.08em">AI</text>

  <!-- Center text. Font size sized so headline fits clear of chart start at x=1170. -->
  <g transform="translate(480 0)">
    <text y="130" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#a78bfa" letter-spacing="6.5">AI OPERATING ARCHITECT</text>
    <text y="218" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="url(#hl1)" letter-spacing="-0.03em">Build. Scale. Deploy.</text>
    <text y="265" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,0.85)">Chief AI Officer · Level9 OS</text>
    <text y="298" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="19" fill="rgba(255,255,255,0.55)">20+ years in the rooms I now build for.</text>
  </g>

  <!-- Right: 6-product bars, bigger + cleaner -->
  <g transform="translate(1180 72)" font-family="SF Mono, Menlo, monospace">
    <text font-size="12" fill="rgba(255,255,255,0.42)" letter-spacing="3">6+ PRODUCTS IN PRODUCTION</text>

    <g transform="translate(0 28)">
      <!-- StratOS -->
      <rect x="0" y="2" width="6" height="28" fill="#8b5cf6" rx="3"/>
      <text x="18" y="22" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">StratOS</text>
      <circle cx="360" cy="16" r="4" fill="#10b981"/>
      <!-- CommandOS -->
      <rect x="0" y="42" width="6" height="28" fill="#10b981" rx="3"/>
      <text x="18" y="62" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">CommandOS</text>
      <circle cx="360" cy="56" r="4" fill="#f59e0b"/>
      <!-- OutboundOS -->
      <rect x="0" y="82" width="6" height="28" fill="#f59e0b" rx="3"/>
      <text x="18" y="102" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">OutboundOS</text>
      <circle cx="360" cy="96" r="4" fill="#10b981"/>
      <!-- LucidORG -->
      <rect x="0" y="122" width="6" height="28" fill="#06b6d4" rx="3"/>
      <text x="18" y="142" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">LucidORG</text>
      <circle cx="360" cy="136" r="4" fill="#10b981"/>
      <!-- COO Playbook -->
      <rect x="0" y="162" width="6" height="28" fill="#94a3b8" rx="3"/>
      <text x="18" y="182" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">COO Playbook</text>
      <circle cx="360" cy="176" r="4" fill="#10b981"/>
      <!-- MAX -->
      <rect x="0" y="202" width="6" height="28" fill="#ec4899" rx="3"/>
      <text x="18" y="222" font-size="17" fill="rgba(255,255,255,0.92)" font-weight="700">MAX</text>
      <circle cx="360" cy="216" r="4" fill="#f59e0b"/>
    </g>

    <!-- Legend -->
    <g transform="translate(0 272)">
      <circle cx="4" cy="6" r="4" fill="#10b981"/>
      <text x="16" y="10" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">LIVE</text>
      <circle cx="74" cy="6" r="4" fill="#f59e0b"/>
      <text x="86" y="10" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">IN PRODUCTION</text>
    </g>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0d0d18" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
