<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 07 · CYCLE. The 4-pressure-point Level9 OS thesis done clean.
       CYCLE. watermark + headline + single clean 4-point ring diagram. -->
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#0a0815"/>
    </linearGradient>
    <!-- Watermark gradient matches banner 04's ALIGN treatment: opaque on
         the left, fades across the word itself so it dies under the
         title text on the right. -->
    <linearGradient id="wm7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.18)"/>
      <stop offset="50%" stop-color="rgba(167,139,250,0.07)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </linearGradient>
    <linearGradient id="hl7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="33%" stop-color="#6ee7b7"/>
      <stop offset="66%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow7" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg7)"/>
  <ellipse cx="1320" cy="198" rx="400" ry="240" fill="url(#glow7)"/>

  <!-- Watermark: CYCLE. left-anchored, gradient-faded across the word so
       it dies under the title text. Matches banner 04 ALIGN pattern. -->
  <text x="-10" y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="340" fill="url(#wm7)" letter-spacing="-0.06em">CYCLE.</text>

  <!-- Center text -->
  <g transform="translate(480 0)">
    <text y="108" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#a78bfa" letter-spacing="6.5">LEVEL9 OS</text>
    <text y="188" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#hl7)" letter-spacing="-0.03em">Decide. Coordinate.</text>
    <text y="248" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="62" fill="url(#hl7)" letter-spacing="-0.03em">Execute. Measure.</text>
    <text y="296" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="19" fill="rgba(255,255,255,0.62)">The operating layer the modern business runs on.</text>
  </g>

  <!-- Right: single clean 4-point ring diagram -->
  <g transform="translate(1340 198)">
    <!-- Outer ring (thin) -->
    <circle r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="2 6"/>

    <!-- Inner ring (thicker) -->
    <circle r="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- 4 pressure points around the ring. Bigger labels. -->
    <!-- TOP · DECIDE (violet) -->
    <g transform="translate(0 -92)">
      <circle r="11" fill="#060610" stroke="#8b5cf6" stroke-width="2.5"/>
      <circle r="4" fill="#8b5cf6"/>
      <text y="-24" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#a78bfa" font-weight="700" letter-spacing="2.2">DECIDE</text>
      <text y="-7" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11" fill="rgba(167,139,250,0.6)" letter-spacing="1.5">01</text>
    </g>

    <!-- RIGHT · COORDINATE (emerald) -->
    <g transform="translate(92 0)">
      <circle r="11" fill="#060610" stroke="#10b981" stroke-width="2.5"/>
      <circle r="4" fill="#10b981"/>
      <text x="24" y="4" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#6ee7b7" font-weight="700" letter-spacing="2.2">COORDINATE</text>
      <text x="24" y="20" font-family="SF Mono, Menlo, monospace" font-size="11" fill="rgba(110,231,183,0.6)" letter-spacing="1.5">02</text>
    </g>

    <!-- BOTTOM · EXECUTE (amber) -->
    <g transform="translate(0 92)">
      <circle r="11" fill="#060610" stroke="#f59e0b" stroke-width="2.5"/>
      <circle r="4" fill="#f59e0b"/>
      <text y="32" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#fbbf24" font-weight="700" letter-spacing="2.2">EXECUTE</text>
      <text y="48" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11" fill="rgba(251,191,36,0.6)" letter-spacing="1.5">03</text>
    </g>

    <!-- LEFT · MEASURE (cyan) -->
    <g transform="translate(-92 0)">
      <circle r="11" fill="#060610" stroke="#06b6d4" stroke-width="2.5"/>
      <circle r="4" fill="#06b6d4"/>
      <text x="-24" y="4" text-anchor="end" font-family="SF Mono, Menlo, monospace" font-size="14" fill="#22d3ee" font-weight="700" letter-spacing="2.2">MEASURE</text>
      <text x="-24" y="20" text-anchor="end" font-family="SF Mono, Menlo, monospace" font-size="11" fill="rgba(34,211,238,0.6)" letter-spacing="1.5">04</text>
    </g>

    <!-- Cycle arrows on outer ring (subtle) -->
    <g fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
      <!-- Top-to-right arc -->
      <path d="M 32 -86 A 92 92 0 0 1 86 -32" marker-end="url(#arr7)"/>
      <path d="M 86 32 A 92 92 0 0 1 32 86" marker-end="url(#arr7)"/>
      <path d="M -32 86 A 92 92 0 0 1 -86 32" marker-end="url(#arr7)"/>
      <path d="M -86 -32 A 92 92 0 0 1 -32 -86" marker-end="url(#arr7)"/>
    </g>
    <defs>
      <marker id="arr7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <polygon points="0 0, 8 4, 0 8" fill="rgba(255,255,255,0.4)"/>
      </marker>
    </defs>

    <!-- Chassis label at center -->
    <text text-anchor="middle" y="4" font-family="SF Mono, Menlo, monospace" font-size="9" fill="rgba(239,68,68,0.75)" letter-spacing="2">CHASSIS</text>
    <text text-anchor="middle" y="18" font-family="SF Mono, Menlo, monospace" font-size="8" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">THE VAULT</text>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0a0815" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
