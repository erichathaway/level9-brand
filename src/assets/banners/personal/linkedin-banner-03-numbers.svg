<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 03 v2 · By the Numbers.
       Removed unreadable binary top. Bigger centered DATA watermark. Bigger stat grid. -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <linearGradient id="hl3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="wm3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(251,191,36,0.18)"/>
      <stop offset="50%" stop-color="rgba(251,191,36,0.07)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </linearGradient>
    <radialGradient id="glow3" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(251,191,36,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg3)"/>
  <ellipse cx="1200" cy="198" rx="500" ry="240" fill="url(#glow3)"/>

  <!-- Left watermark: massive DATA centered vertically, gradient-faded -->
  <text x="-8" y="300" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="260" fill="url(#wm3)" letter-spacing="-0.06em">DATA.</text>

  <!-- Center text. Font sized so headline fits clear of stat grid at x=1080. -->
  <g transform="translate(480 0)">
    <text y="130" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#fbbf24" letter-spacing="6.5">AI OPERATING ARCHITECT</text>
    <text y="218" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#hl3)" letter-spacing="-0.03em">By the numbers.</text>
    <text y="264" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" fill="rgba(255,255,255,0.82)">What two decades of operating actually built.</text>
    <text y="296" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.6)">Now running on AI.</text>
  </g>

  <!-- Right: 4-stat grid (2x2), bigger cells -->
  <g transform="translate(1080 64)" font-family="Inter, system-ui, sans-serif">
    <!-- 20+ YEARS -->
    <g transform="translate(0 0)">
      <rect width="240" height="130" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
      <text x="18" y="36" font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(167,139,250,0.9)" letter-spacing="3">EXECUTIVE ROLES</text>
      <text x="18" y="100" font-weight="900" font-size="64" fill="#a78bfa" letter-spacing="-0.04em">20+</text>
      <text x="140" y="100" font-family="SF Mono, Menlo, monospace" font-size="13" fill="rgba(255,255,255,0.55)" letter-spacing="2">YEARS</text>
    </g>

    <!-- 6+ PRODUCTS -->
    <g transform="translate(260 0)">
      <rect width="240" height="130" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(110,231,183,0.4)" stroke-width="1"/>
      <text x="18" y="36" font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(110,231,183,0.9)" letter-spacing="3">IN PRODUCTION</text>
      <text x="18" y="100" font-weight="900" font-size="64" fill="#6ee7b7" letter-spacing="-0.04em">6+</text>
      <text x="120" y="100" font-family="SF Mono, Menlo, monospace" font-size="13" fill="rgba(255,255,255,0.55)" letter-spacing="2">PRODUCTS</text>
    </g>

    <!-- 48 OFFICERS -->
    <g transform="translate(0 148)">
      <rect width="240" height="130" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
      <text x="18" y="36" font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(16,185,129,0.95)" letter-spacing="3">AGENT FLEET</text>
      <text x="18" y="100" font-weight="900" font-size="64" fill="#10b981" letter-spacing="-0.04em">48</text>
      <text x="110" y="100" font-family="SF Mono, Menlo, monospace" font-size="13" fill="rgba(255,255,255,0.55)" letter-spacing="2">OFFICERS</text>
    </g>

    <!-- 94 OFFICES -->
    <g transform="translate(260 148)">
      <rect width="240" height="130" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
      <text x="18" y="36" font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(34,211,238,0.95)" letter-spacing="3">MSFT WWPS</text>
      <text x="18" y="100" font-weight="900" font-size="64" fill="#22d3ee" letter-spacing="-0.04em">94</text>
      <text x="110" y="100" font-family="SF Mono, Menlo, monospace" font-size="13" fill="rgba(255,255,255,0.55)" letter-spacing="2">OFFICES</text>
    </g>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0d0d18" stroke="rgba(251,191,36,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
