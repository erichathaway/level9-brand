<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 02 v2 · The Arc.
       Bigger headline + subline. Watermark vertically centered and gradient-faded
       so it dies under the center text. Chart labels larger. Less text overall. -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.35)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0)"/>
    </linearGradient>
    <linearGradient id="hl2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="wm2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.18)"/>
      <stop offset="50%" stop-color="rgba(167,139,250,0.08)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg2)"/>

  <!-- Left watermark: two massive stacked words, centered vertically, gradient-faded -->
  <text x="-8" y="195" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="140" fill="url(#wm2)" letter-spacing="-0.06em">OPERATOR.</text>
  <text x="-8" y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="140" fill="url(#wm2)" letter-spacing="-0.06em">ARCHITECT.</text>

  <!-- Center text. Headline broken to 2 lines so font can breathe and stay clear
       of the chart starting at x=1140. -->
  <g transform="translate(480 0)">
    <text y="88" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#22d3ee" letter-spacing="6.5">CHIEF AI OFFICER</text>
    <text y="172" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="72" fill="url(#hl2)" letter-spacing="-0.03em">From operator.</text>
    <text y="244" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="72" fill="url(#hl2)" letter-spacing="-0.03em">To architect.</text>
    <text y="288" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" fill="rgba(255,255,255,0.75)">20+ years Microsoft · Credit Suisse · S&amp;P · T-Mobile · Zoot.</text>
    <text y="318" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.55)">5+ years building Level9 OS.</text>
  </g>

  <!-- Right: ascending trend line, bigger labels -->
  <g transform="translate(1140 80)">
    <text x="0" y="0" font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(255,255,255,0.5)" letter-spacing="3">CAREER ARC</text>

    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
      <line x1="0" y1="80"  x2="420" y2="80"/>
      <line x1="0" y1="150" x2="420" y2="150"/>
      <line x1="0" y1="220" x2="420" y2="220"/>
    </g>

    <!-- Area fill -->
    <path d="M 0 240 L 0 220 L 80 195 L 170 160 L 270 115 L 350 60 L 420 30 L 420 240 Z" fill="url(#fill2)"/>

    <!-- Trend line -->
    <path d="M 0 220 L 80 195 L 170 160 L 270 115 L 350 60 L 420 30" stroke="url(#line2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Milestone dots + labels. Bigger fonts -->
    <g font-family="SF Mono, Menlo, monospace">
      <circle cx="0"   cy="220" r="8" fill="#0a0a18" stroke="#06b6d4" stroke-width="2.5"/>
      <text x="-8" y="252" font-size="14" fill="#22d3ee" font-weight="700" letter-spacing="1.5">1991</text>

      <circle cx="170" cy="160" r="8" fill="#0a0a18" stroke="#8b5cf6" stroke-width="2.5"/>
      <text x="160" y="145" font-size="14" fill="#a78bfa" font-weight="700" letter-spacing="1.5">2008</text>

      <circle cx="350" cy="60" r="8" fill="#0a0a18" stroke="#ec4899" stroke-width="2.5"/>
      <text x="336" y="45" font-size="14" fill="#ec4899" font-weight="700" letter-spacing="1.5">2020</text>

      <circle cx="420" cy="30" r="12" fill="#ec4899">
        <animate attributeName="r" values="9;13;9" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="400" y="15" font-size="13" fill="#ec4899" font-weight="700" letter-spacing="1.5">NOW</text>
    </g>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0a0a18" stroke="rgba(236,72,153,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
