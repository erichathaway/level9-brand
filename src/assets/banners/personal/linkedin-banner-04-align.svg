<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 04 · The Original, redone. ALIGN watermark + Architect/Build/Scale
       headline + 4-bar verified-metrics chart. Spine-corrected from original
       (30 years → 20+, Fractional COO → Chief AI Officer). -->
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="wm4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(167,139,250,0.16)"/>
      <stop offset="50%" stop-color="rgba(167,139,250,0.07)"/>
      <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </linearGradient>
    <!-- bar gradients -->
    <linearGradient id="bar4a" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="bar4b" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="bar4c" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#be185d"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="bar4d" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg4)"/>

  <!-- ALIGN watermark. massive, gradient-faded left-to-right -->
  <text x="-10" y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="340" fill="url(#wm4)" letter-spacing="-0.06em">ALIGN</text>

  <!-- Center text -->
  <g transform="translate(480 0)">
    <text y="108" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#10b981" letter-spacing="6.5">ERICHATHAWAY.COM</text>
    <text y="188" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="68" fill="rgba(255,255,255,0.96)" letter-spacing="-0.03em">Architect.</text>
    <text y="254" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="68" fill="rgba(255,255,255,0.96)" letter-spacing="-0.03em">Build. Scale.</text>
    <text y="298" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.6)">20+ years · 6 continents · Chief AI Officer</text>
  </g>

  <!-- Right: 4-bar chart with verified resume metrics -->
  <g transform="translate(1170 80)" font-family="SF Mono, Menlo, monospace">
    <text x="0" y="0" font-size="12" fill="rgba(255,255,255,0.42)" letter-spacing="3">BY THE NUMBERS</text>

    <!-- chart baseline y=260 (bars grow upward from here). Number labels
         positioned directly above each bar's top so they line up visually
         regardless of bar height. -->
    <!-- Bar 1 · 20%+ MARKET SHARE · bar_top=60 → label y=54 -->
    <g transform="translate(0 0)">
      <text x="36" y="54" text-anchor="middle" font-size="18" fill="#a78bfa" font-weight="700">20%+</text>
      <rect x="0" y="60" width="72" height="200" rx="8" fill="url(#bar4a)"/>
      <text x="36" y="282" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">MARKET SHARE</text>
    </g>

    <!-- Bar 2 · 30%+ MARGIN · bar_top=40 → label y=34 -->
    <g transform="translate(92 0)">
      <text x="36" y="34" text-anchor="middle" font-size="18" fill="#22d3ee" font-weight="700">30%+</text>
      <rect x="0" y="40" width="72" height="220" rx="8" fill="url(#bar4b)"/>
      <text x="36" y="282" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">MARGIN LIFT</text>
    </g>

    <!-- Bar 3 · 94 OFFICES · bar_top=76 → label y=70 -->
    <g transform="translate(184 0)">
      <text x="36" y="70" text-anchor="middle" font-size="18" fill="#f472b6" font-weight="700">94</text>
      <rect x="0" y="76" width="72" height="184" rx="8" fill="url(#bar4c)"/>
      <text x="36" y="282" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">OFFICES (MSFT)</text>
    </g>

    <!-- Bar 4 · 2x THROUGHPUT · bar_top=20 → label y=14 -->
    <g transform="translate(276 0)">
      <text x="36" y="14" text-anchor="middle" font-size="18" fill="#fbbf24" font-weight="700">2x</text>
      <rect x="0" y="20" width="72" height="240" rx="8" fill="url(#bar4d)"/>
      <text x="36" y="282" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">THROUGHPUT</text>
    </g>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0a0a18" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
