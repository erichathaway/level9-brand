<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <!-- Banner 05 · Client Wall. EXPERIENCE. watermark + rooms-I-now-build-for
       headline + right column of legacy employer wordmarks. -->
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <linearGradient id="hl5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <!-- Watermark gradient matches banner 04's ALIGN treatment: opaque on
         the left, fades across the word itself so it dies under the
         title text on the right. -->
    <linearGradient id="wm5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.18)"/>
      <stop offset="50%" stop-color="rgba(34,211,238,0.07)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </linearGradient>
    <radialGradient id="glow5" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg5)"/>
  <ellipse cx="1260" cy="198" rx="400" ry="240" fill="url(#glow5)"/>

  <!-- Watermark: ROOMS. left-anchored, gradient-faded across the word so
       it dies naturally before/under the title text. Matches banner 04's
       ALIGN pattern. -->
  <text x="-10" y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="340" fill="url(#wm5)" letter-spacing="-0.06em">ROOMS.</text>

  <!-- Center text -->
  <g transform="translate(480 0)">
    <text y="108" font-family="SF Mono, Menlo, monospace" font-size="15" fill="#22d3ee" letter-spacing="6.5">CHIEF AI OFFICER</text>
    <text y="188" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="68" fill="url(#hl5)" letter-spacing="-0.03em">The rooms I now</text>
    <text y="254" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="68" fill="url(#hl5)" letter-spacing="-0.03em">build for.</text>
    <text y="298" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.6)">20+ years across enterprise, fintech, telecom, SaaS.</text>
  </g>

  <!-- Right: the rooms served. Audience types instead of specific companies
       so it reads as positioning, not name-drops. -->
  <g transform="translate(1180 78)" font-family="Inter, system-ui, sans-serif">
    <text font-family="SF Mono, Menlo, monospace" font-size="12" fill="rgba(255,255,255,0.42)" letter-spacing="3">ROOMS SERVED</text>

    <g transform="translate(0 36)">
      <text y="24"  font-weight="700" font-size="22" fill="rgba(255,255,255,0.92)" letter-spacing="-0.01em">Boards</text>
      <text y="62"  font-weight="700" font-size="22" fill="rgba(255,255,255,0.92)" letter-spacing="-0.01em">Executive Teams</text>
      <text y="100" font-weight="700" font-size="22" fill="rgba(255,255,255,0.92)" letter-spacing="-0.01em">Innovation Labs</text>
      <text y="138" font-weight="700" font-size="22" fill="rgba(255,255,255,0.92)" letter-spacing="-0.01em">Management Teams</text>
      <text y="176" font-weight="700" font-size="22" fill="rgba(255,255,255,0.92)" letter-spacing="-0.01em">Investor Forums</text>

      <!-- Vertical gradient line accent -->
      <line x1="-18" y1="0" x2="-18" y2="184" stroke="url(#hl5)" stroke-width="2" opacity="0.6"/>
    </g>

    <g transform="translate(0 236)">
      <text font-family="SF Mono, Menlo, monospace" font-size="10" fill="rgba(255,255,255,0.45)" letter-spacing="2">20+ YEARS · 6 CONTINENTS · 60+ COUNTRIES</text>
    </g>
  </g>

  <!-- Level9 co-sign -->
  <g transform="translate(1520 348)">
    <rect width="32" height="32" rx="7" fill="#0a0812" stroke="rgba(34,211,238,0.5)" stroke-width="1"/>
    <text x="16" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" transform="rotate(-14 16 21)" style="letter-spacing:-0.04em">9</text>
  </g>
</svg>
