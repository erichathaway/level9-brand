<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Stay Level vertical static share card (1080x1920).
       Portrait companion to stay-level.svg. Same composition as the
       animated vertical tile with bubble at true center, no animations.
       For Reels / Shorts / TikTok cover frames and static image posts. -->

  <defs>
    <linearGradient id="vslPalette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a5f3fc"/>
      <stop offset="20%"  stop-color="#22d3ee"/>
      <stop offset="40%"  stop-color="#a78bfa"/>
      <stop offset="60%"  stop-color="#f472b6"/>
      <stop offset="80%"  stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="vslGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <radialGradient id="vslBubble" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.55)"/>
    </radialGradient>
    <radialGradient id="vslGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(167,139,250,0.32)"/>
      <stop offset="42%"  stop-color="rgba(244,114,182,0.16)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Base bg -->
  <rect width="1080" height="1920" fill="#060610"/>

  <!-- Multi-color glow centered on hero zone -->
  <ellipse cx="540" cy="980" rx="620" ry="500" fill="url(#vslGlow)"/>

  <!-- Subtle horizon line behind level -->
  <line x1="60" y1="965" x2="1020" y2="965" stroke="url(#vslPalette)" stroke-width="1.5" stroke-opacity="0.22"/>

  <!-- M / W / F section markers above level -->
  <text x="380" y="800" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="18" letter-spacing="0.3em" fill="rgba(139,92,246,0.92)">M</text>
  <circle cx="380" cy="830" r="12" fill="#8b5cf6"/>

  <text x="540" y="800" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="18" letter-spacing="0.3em" fill="rgba(6,182,212,0.92)">W</text>
  <circle cx="540" cy="830" r="12" fill="#06b6d4"/>

  <text x="700" y="800" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="18" letter-spacing="0.3em" fill="rgba(236,72,153,0.92)">F</text>
  <circle cx="700" cy="830" r="12" fill="#ec4899"/>

  <!-- Bubble level body -->
  <g>
    <rect x="120" y="900" width="840" height="130" rx="65" fill="#0d0d18" stroke="url(#vslPalette)" stroke-width="4"/>
    <rect x="170" y="942" width="740" height="46" rx="23" fill="url(#vslGlass)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <line x1="510" y1="932" x2="510" y2="998" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>
    <line x1="570" y1="932" x2="570" y2="998" stroke="rgba(255,255,255,0.32)" stroke-width="1.5"/>
    <circle cx="540" cy="965" r="17" fill="url(#vslBubble)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  </g>

  <!-- Top band: eyebrow -->
  <text x="72" y="115" font-family="SF Mono, Menlo, monospace" font-size="18" letter-spacing="0.5em" fill="#22d3ee" opacity="0.9">OPERATOR-GRADE THINKING</text>

  <!-- LIVE chip -->
  <g>
    <rect x="64" y="132" width="92" height="36" rx="18" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="84" cy="150" r="4" fill="#10b981"/>
    <text x="98" y="155" font-family="SF Mono, Menlo, monospace" font-size="14" letter-spacing="0.2em" fill="#10b981">LIVE</text>
  </g>
  <text x="180" y="156" font-family="SF Mono, Menlo, monospace" font-size="14" letter-spacing="0.3em" fill="rgba(255,255,255,0.42)">M/W/F NEWSLETTER · LEVEL9OS</text>

  <!-- Wordmark -->
  <text x="72" y="430" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="200" letter-spacing="-0.04em" fill="url(#vslPalette)">Stay Level.</text>

  <!-- Copy zone (below hero level) -->
  <text x="72" y="1392" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="40" letter-spacing="-0.01em" fill="rgba(255,255,255,0.78)">On the shifts. The scars. The forward.</text>
  <text x="72" y="1470" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="36" letter-spacing="-0.01em" fill="#a78bfa">Operator-grade thinking, three lenses, M/W/F.</text>

  <!-- Bottom band: layer + domain -->
  <text x="72" y="1772" font-family="SF Mono, Menlo, monospace" font-size="16" letter-spacing="0.3em" fill="rgba(255,255,255,0.35)">OPERATOR · NEWSLETTER</text>
  <text x="72" y="1820" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,0.58)">erichathaway.substack.com</text>

  <!-- Level9 co-sign bottom-right -->
  <g>
    <rect x="876" y="1768" width="56" height="56" rx="12" fill="#0d0d18" stroke="rgba(167,139,250,0.6)" stroke-width="1.5" opacity="0.85"/>
    <text x="904" y="1812" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="-0.04em" fill="white" transform="rotate(-14 904 1810)">9</text>
    <text x="944" y="1796" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="18" fill="rgba(255,255,255,0.72)">Level9 OS</text>
    <text x="944" y="1820" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.18em" fill="rgba(255,255,255,0.4)">PUBLICATION</text>
  </g>
</svg>
