<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Stay Level static share card (1200x630). OG image + post header.
       Same layout as StayLevelTile (animated) with bubble at true center,
       no animations baked in. Renders cleanly to PNG/JPG for OG slots. -->

  <defs>
    <linearGradient id="slPalette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a5f3fc"/>
      <stop offset="20%"  stop-color="#22d3ee"/>
      <stop offset="40%"  stop-color="#a78bfa"/>
      <stop offset="60%"  stop-color="#f472b6"/>
      <stop offset="80%"  stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="slGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <radialGradient id="slBubble" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.55)"/>
    </radialGradient>
    <radialGradient id="slGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(167,139,250,0.28)"/>
      <stop offset="40%"  stop-color="rgba(244,114,182,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Base bg -->
  <rect width="1200" height="630" fill="#060610"/>

  <!-- Multi-color glow on the right -->
  <ellipse cx="950" cy="300" rx="430" ry="360" fill="url(#slGlow)"/>

  <!-- Subtle horizon line behind level -->
  <line x1="640" y1="325" x2="1180" y2="325" stroke="url(#slPalette)" stroke-width="1" stroke-opacity="0.20"/>

  <!-- M / W / F section markers above level -->
  <text x="800" y="208" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="9" letter-spacing="0.3em" fill="rgba(139,92,246,0.9)">M</text>
  <circle cx="800" cy="225" r="6" fill="#8b5cf6"/>

  <text x="920" y="208" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="9" letter-spacing="0.3em" fill="rgba(6,182,212,0.9)">W</text>
  <circle cx="920" cy="225" r="6" fill="#06b6d4"/>

  <text x="1040" y="208" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="9" letter-spacing="0.3em" fill="rgba(236,72,153,0.9)">F</text>
  <circle cx="1040" cy="225" r="6" fill="#ec4899"/>

  <!-- Bubble level body (no tilt in static) -->
  <g>
    <rect x="710" y="290" width="420" height="70" rx="35" fill="#0d0d18" stroke="url(#slPalette)" stroke-width="2.5"/>
    <rect x="740" y="312" width="360" height="26" rx="13" fill="url(#slGlass)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <line x1="903" y1="306" x2="903" y2="344" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
    <line x1="937" y1="306" x2="937" y2="344" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
    <circle cx="920" cy="325" r="10" fill="url(#slBubble)" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>
  </g>

  <!-- Eyebrow -->
  <text x="72" y="98" font-family="SF Mono, Menlo, monospace" font-size="11" letter-spacing="0.5em" fill="#22d3ee" opacity="0.9">OPERATOR-GRADE THINKING</text>

  <!-- LIVE chip -->
  <g>
    <rect x="64" y="106" width="62" height="24" rx="12" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="78" cy="118" r="3" fill="#10b981"/>
    <text x="89" y="122" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="0.2em" fill="#10b981">LIVE</text>
  </g>
  <text x="142" y="122" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="0.3em" fill="rgba(255,255,255,0.42)">M/W/F NEWSLETTER · LEVEL9OS</text>

  <!-- Wordmark -->
  <text x="72" y="288" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="112" letter-spacing="-0.04em" fill="url(#slPalette)">Stay Level.</text>

  <!-- Copy block -->
  <text x="72" y="370" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="24" letter-spacing="-0.01em" fill="rgba(255,255,255,0.78)">On the shifts. The scars. The forward.</text>
  <text x="72" y="412" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" letter-spacing="-0.01em" fill="#a78bfa">Operator-grade thinking, three lenses, M/W/F.</text>

  <!-- Bottom-left: layer + domain -->
  <text x="72" y="566" font-family="SF Mono, Menlo, monospace" font-size="10" letter-spacing="0.3em" fill="rgba(255,255,255,0.35)">OPERATOR · NEWSLETTER</text>
  <text x="72" y="600" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.58)">erichathaway.substack.com</text>

  <!-- Level9 co-sign bottom-right -->
  <g>
    <rect x="1040" y="568" width="40" height="40" rx="8" fill="#0d0d18" stroke="rgba(167,139,250,0.6)" stroke-width="1" opacity="0.85"/>
    <text x="1060" y="599" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.04em" fill="white" transform="rotate(-14 1060 597)">9</text>
    <text x="1090" y="586" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="rgba(255,255,255,0.68)">Level9 OS</text>
    <text x="1090" y="603" font-family="SF Mono, Menlo, monospace" font-size="9" letter-spacing="0.16em" fill="rgba(255,255,255,0.35)">PUBLICATION</text>
  </g>
</svg>
